    function cancel() { clearTimeout(pressTimer); }
    btn.addEventListener("touchstart", start, { passive: true });
    btn.addEventListener("touchend", cancel);
    btn.addEventListener("touchmove", cancel);
    btn.addEventListener("mousedown", start);
    btn.addEventListener("mouseup", cancel);
    btn.addEventListener("mouseleave", cancel);
    // Swallow the click that a touch-based long-press also fires, so it
    // doesn't ALSO send a heart right as the settings sheet opens.
    btn.addEventListener("click", (e) => { if (longPressed) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  })();

  elInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  elSend.addEventListener("click", sendMessage);

  /* ── Random question button ───────────────────────────────────── */
  let fcQuestionCooldown = false;
  const elQuestionBtn = $("fc-question-btn");
  if (elQuestionBtn) {
    elQuestionBtn.addEventListener("click", async () => {
      if (fcQuestionCooldown || !socket?.connected) return;
      fcQuestionCooldown = true;
      elQuestionBtn.disabled = true;
      elQuestionBtn.textContent = "⌛";
      try {
        const res = await fetch("/api/random-question");
        const data = await res.json();
        if (data.question) {
          appendMessage({ from: myUsername, type: "question", text: data.question, ts: new Date().toISOString() });
          socket.emit("friendChat:question", { toUsername: friendName, text: data.question });
        }
      } catch (_) {
        showToast("კითხვა ვერ ჩაიტვირთა 😕");
      } finally {
        setTimeout(() => {
          fcQuestionCooldown = false;
          elQuestionBtn.disabled = false;
          elQuestionBtn.textContent = "?";
        }, 3000);
      }
    });
  }

  /* ── Photo sending (Pro only) ────────────────────────────────── */
  const elPhotoBtn   = $("fc-photo-btn");
  const elPhotoInput = $("fc-photo-input");
  const PHOTO_MAX_BYTES = 20 * 1024 * 1024; // must match the server's raw-input cap

  // Called once we actually know isPro (see the auth:authenticated and
  // auth:proStatusChanged handlers above) — reveals the button for pro
  // users, and makes sure it disappears again if pro status is revoked
  // while this session is still open.
  function refreshPhotoBtnVisibility() {
    if (elPhotoBtn) elPhotoBtn.style.display = myIsPro ? "" : "none";
  }

  if (elPhotoBtn && elPhotoInput) {
    elPhotoBtn.addEventListener("click", () => {
      if (!myIsPro) return; // defence in depth — button should be hidden anyway
      elPhotoInput.click();
    });

    elPhotoInput.addEventListener("change", () => {
      const file = elPhotoInput.files && elPhotoInput.files[0];
      elPhotoInput.value = ""; // reset so picking the SAME file again still fires 'change'
      if (!file) return;

      // Deliberately lenient here — file.type is reported by the browser
      // and isn't always reliable (some Android pickers leave it blank for
      // less common formats like HEIC). The server decodes the actual
      // bytes with sharp and is the real authority on whether this is a
      // genuine image; this is just a fast pre-check to skip an obviously
      // wrong upload (a PDF, a video, etc.) before spending the bandwidth.
      if (file.type && !file.type.startsWith("image/")) {
        showToast("⚠️ მხოლოდ სურათის ფაილებია დაშვებული");
        return;
      }
      if (file.size > PHOTO_MAX_BYTES) {
        showToast("⚠️ ფოტო ზედმეტად დიდია (მაქს. 20MB)");
        return;
      }
      if (!socket?.connected) {
        showToast("⚠️ კავშირი არ არის");
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        // FileReader gives a data: URI ("data:image/png;base64,XXXX") — the
        // server only wants the base64 payload itself.
        const commaIdx = String(reader.result).indexOf(",");
        const base64 = commaIdx >= 0 ? reader.result.slice(commaIdx + 1) : "";
        if (!base64) { showToast("⚠️ ფოტოს წაკითხვა ვერ მოხერხდა"); return; }

        const msgId = fcGenId();
        // Optimistic local render, same pattern as text sends — the photo
        // shows immediately rather than waiting on a round trip, and the
        // photoSent handler above will surface an error if it actually failed.
        appendMessage({ id: msgId, from: myUsername, type: "photo", photoUrl: reader.result, ts: new Date().toISOString() });

        socket.emit("privateMsg:sendPhoto", {
          toUsername: friendName,
          photoData: base64,
          mimeType: file.type,
          messageId: msgId,
        });
      };
      reader.onerror = () => showToast("⚠️ ფოტოს წაკითხვა ვერ მოხერხდა");
      reader.readAsDataURL(file);
    });
  }


  const elGifBtn     = $("fc-gif-btn");
  const elGifPicker  = $("fc-gif-picker");
  const elGifSearch  = $("fc-gif-search");
  const elGifResults = $("fc-gif-results");
  let gifFetchController = null;
  let gifSearchTimer     = null;

  function openGifPicker() {
    if (!elGifPicker) return;
    elGifPicker.style.display = "flex";
    elGifPicker.getBoundingClientRect(); // force reflow before transition
    elGifPicker.classList.add("open");
    if (elGifSearch) { elGifSearch.value = ""; elGifSearch.focus(); }
    fetchGifs("");
  }
  function closeGifPicker() {
    if (!elGifPicker) return;
    elGifPicker.classList.remove("open");
    setTimeout(() => { if (!elGifPicker.classList.contains("open")) elGifPicker.style.display = "none"; }, 250);
  }

  async function fetchGifs(query) {
    if (!elGifResults) return;
    if (gifFetchController) gifFetchController.abort();
    // Hold our own reference: gifFetchController is shared state and a newer
    // search may replace it while this one is still awaiting.
    const myController = new AbortController();
    gifFetchController = myController;
    elGifResults.innerHTML = '<div class="gif-placeholder">Loading...</div>';
    try {
      const url = query ? `/api/gifs?q=${encodeURIComponent(query)}` : "/api/gifs";
      const res  = await fetch(url, { signal: myController.signal });
      const data = await res.json();
      // Ignore results from a search that has since been superseded, so a
      // slow older response can't overwrite newer results.
      if (gifFetchController !== myController) return;
      renderGifResults(data.results || []);
    } catch (err) {
      if (err.name !== "AbortError" && gifFetchController === myController) {
        elGifResults.innerHTML = '<div class="gif-placeholder">Failed to load GIFs 😢</div>';
      }
    } finally {
      // Only clear it if we're still the current request. Clearing
      // unconditionally wiped the reference to a NEWER in-flight controller,
      // so the next search couldn't abort it and two responses would race.
      if (gifFetchController === myController) gifFetchController = null;
    }
  }

  function renderGifResults(results) {
    if (!elGifResults) return;
    if (!results.length) {
      elGifResults.innerHTML = '<div class="gif-placeholder">No GIFs found</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    results.forEach(result => {
      const media      = result.media && result.media[0];
      const previewUrl = media?.tinygif?.url || media?.gif?.url;
      const fullUrl    = media?.gif?.url;
      if (!previewUrl || !fullUrl) return;
      const img = document.createElement("img");
      img.src       = previewUrl;
      img.className = "fc-gif-item";
      img.loading   = "lazy";
      img.decoding  = "async";
      img.addEventListener("click", () => sendFCGif(fullUrl));
      frag.appendChild(img);
    });
    elGifResults.innerHTML = "";
    elGifResults.appendChild(frag);
  }

  function sendFCGif(url) {
    if (!socket?.connected) return;
    socket.emit("friendChat:gif", { toUsername: friendName, url });
    appendMessage({ from: myUsername, type: "gif", url, ts: new Date().toISOString() });
    closeGifPicker();
  }

  if (elGifBtn)    elGifBtn.addEventListener("click", openGifPicker);
  if (elGifSearch) elGifSearch.addEventListener("input", () => {
    clearTimeout(gifSearchTimer);
    gifSearchTimer = setTimeout(() => fetchGifs(elGifSearch.value.trim()), 350);
  });

  /* ── Start ───────────────────────────────────────────────────── */
  init();

})();
</script>
</body>
